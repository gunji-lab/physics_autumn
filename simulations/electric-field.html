<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6f3ea">
  <title>電場を理解する</title>
  <style>
:root{--ink:#17202a;--paper:#f6f3ea;--card:#fffef9;--line:#d8d2c4;--blue:#2878d4;--red:#ed5a4f;--gold:#f3b63f;--green:#13866f;--shadow:0 10px 30px rgba(31,38,45,.09)}
*{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--paper);color:var(--ink);font-family:"Meiryo","メイリオ",sans-serif}body{margin:0;min-height:100vh}button,input{font:inherit}button{touch-action:manipulation}
header{max-width:980px;margin:auto;padding:24px 20px 18px}h1{font-family:inherit;font-size:clamp(36px,6vw,56px);line-height:1;margin:0 0 8px;letter-spacing:.04em}header p{margin:0;color:#58616a;font-size:15px}
main{max-width:980px;margin:auto;padding:0 16px 64px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px}.tab{border:1px solid var(--line);background:rgba(255,255,255,.55);padding:11px 6px;border-radius:13px;color:#62676c;font-weight:700;cursor:pointer}.tab span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#dedbd3;margin-right:3px;font-size:12px}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.tab.active span{background:var(--gold);color:var(--ink)}
.lesson-card,.sim-card,.insight{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.lesson-card{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 20px;margin-bottom:12px}.lesson-kicker{font-size:11px;letter-spacing:.16em;color:var(--green);font-weight:800}.lesson-card h2{font-size:21px;margin:4px 0 7px}.lesson-card p{font-size:14px;line-height:1.7;margin:0;color:#505a62;max-width:650px}.formula{white-space:nowrap;background:#f0eee7;border-radius:12px;padding:12px 15px;font-family:inherit;font-size:20px;font-style:italic}
.sim-card{overflow:hidden}.toolbar{padding:12px;display:flex;gap:8px;justify-content:space-between;border-bottom:1px solid var(--line);overflow-x:auto}.toolgroup{display:flex;gap:6px}.tool,.ghost{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;white-space:nowrap;font-weight:700;cursor:pointer}.tool.active{outline:3px solid rgba(23,134,111,.18);border-color:var(--green)}.tool.positive{color:#b72e2b}.tool.negative{color:#185da8}.tool.danger{color:#777}.ghost{color:#555;background:transparent}
.canvas-wrap{position:relative;background:#fafbfc;min-height:430px}.canvas-wrap canvas{display:block;width:100%;height:430px;touch-action:none}.canvas-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(23,32,42,.84);color:#fff;border-radius:99px;padding:8px 13px;font-size:12px;pointer-events:none;transition:.25s;white-space:nowrap}.legend{position:absolute;bottom:10px;left:10px;display:flex;gap:10px;background:rgba(255,255,255,.9);padding:7px 9px;border:1px solid #ddd;border-radius:10px;font-size:11px}.legend span{display:flex;align-items:center;gap:4px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.dot.plus{background:var(--red)}.dot.minus{background:var(--blue)}.dot.probe{background:var(--gold);border:1px solid #624d12}
.readout{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.readout>div{padding:12px 14px;border-right:1px solid var(--line);min-width:0}.readout>div:last-child{border:0}.readout span{display:block;font-size:10px;color:#727980;margin-bottom:3px}.readout strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.force-top-control{display:flex;align-items:center;gap:10px;min-width:min(520px,70vw);flex:1}.force-top-control label{font-weight:800;font-size:13px;white-space:nowrap}.force-top-control input{flex:1;min-width:110px;accent-color:var(--green)}.force-top-control output{font-size:20px;font-weight:900;min-width:34px;text-align:center}.force-top-control span{font-size:10px;color:#777;white-space:nowrap}
.insight{display:flex;gap:13px;padding:16px 18px;margin:12px 0}.bulb{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;background:var(--gold);border-radius:50%;font-family:inherit;font-weight:bold;font-size:20px}.insight h3{margin:0 0 4px;font-size:14px}.insight p{margin:0;font-size:13px;line-height:1.65;color:#555f66}.trainer-back{display:inline-block;margin-top:10px;color:#356a62;font-size:13px;font-weight:700;text-decoration:none}.trainer-back:hover{text-decoration:underline}
@media(max-width:640px){header{padding:20px 12px 16px}h1{font-size:34px}header p{font-size:15px;line-height:1.6}main{padding:0 8px 40px}.tabs{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;gap:8px}.tab{font-size:15px;padding:14px 6px;min-height:52px}.tab span{display:none}.lesson-card{display:block;padding:18px 16px}.lesson-kicker{font-size:12px}.lesson-card h2{font-size:20px;line-height:1.5}.lesson-card p{font-size:15px;line-height:1.8}.formula{display:inline-block;margin-top:12px;font-size:19px}.toolbar{padding:12px;gap:10px;flex-wrap:wrap;overflow:visible}.force-top-control{min-width:0;width:100%;flex:0 0 100%;flex-wrap:wrap;gap:8px}.force-top-control label{font-size:15px;width:100%}.force-top-control input{height:36px;min-width:180px}.force-top-control output{font-size:24px;min-width:42px}.force-top-control span{display:none}.ghost{flex:1;min-height:48px;font-size:14px}.canvas-wrap,.canvas-wrap canvas{height:480px;min-height:480px}.canvas-hint{font-size:12px;line-height:1.45;max-width:88%;white-space:normal;text-align:center}.legend{font-size:12px;gap:8px;padding:8px}.readout{grid-template-columns:repeat(2,1fr)}.readout>div{padding:14px;border-bottom:1px solid var(--line)}.readout span{font-size:11px}.readout strong{font-size:15px}.insight{padding:17px 16px}.insight h3{font-size:16px}.insight p{font-size:15px;line-height:1.75}.trainer-back{font-size:14px;padding:5px 0}}

  </style>
</head>
<body>
  <header>
    <h1>電場を理解する</h1>
    <p>電荷を置いて、見えない空間の変化を指で確かめよう。</p>
    <a class="trainer-back" href="index.html">← シミュレーション一覧へ</a>
  </header>

  <main>
    <nav class="tabs" aria-label="学習ステップ">
      <button class="tab active" data-mode="field"><span>1</span> 電場</button>
      <button class="tab" data-mode="force"><span>2</span> 電気力</button>
    </nav>

    <section class="lesson-card">
      <div>
        <div class="lesson-kicker" id="lessonKicker">STEP 1</div>
        <h2 id="lessonTitle">電荷を置くと、空間が変わる</h2>
        <p id="lessonText">＋や−の電荷を置いてみよう。矢印は、その場所に正の試験電荷を置いたときに力を受ける向きです。</p>
      </div>
      <div class="formula" id="formula">E = kQ / r²</div>
    </section>

    <section class="sim-card">
      <div class="toolbar">
        <div class="toolgroup" id="sourceTools" aria-label="配置ツール">
          <button class="tool active positive" data-tool="positive">＋ 電荷</button>
          <button class="tool negative" data-tool="negative">− 電荷</button>
          <button class="tool" data-tool="move">↔ 動かす</button>
          <button class="tool danger" data-tool="delete">× 消す</button>
        </div>
        <div class="force-top-control" id="fieldTopControl">
          <label for="sourceCharge">電場をつくる電荷 Q</label>
          <input id="sourceCharge" type="range" min="-5" max="5" value="1" step="1">
          <output id="sourceChargeOut">＋1</output>
          <span>相対値</span>
        </div>
        <div class="force-top-control" id="forceTopControl" hidden>
          <label for="testCharge">置く電荷 q</label>
          <input id="testCharge" type="range" min="-5" max="5" value="1" step="1">
          <output id="testChargeOut">＋1</output>
          <span>相対値</span>
        </div>
        <button id="probeToggle" class="ghost">試験電荷を隠す</button>
        <button id="resetBtn" class="ghost">リセット</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="simCanvas" aria-label="電場シミュレーション"></canvas>
        <div class="canvas-hint" id="canvasHint">空いている場所をタップして＋電荷を置こう</div>
        <div class="legend">
          <span><i class="dot plus"></i>正電荷</span>
          <span><i class="dot minus"></i>負電荷</span>
          <span id="probeLegend" hidden><i class="dot probe"></i>試験電荷</span>
        </div>
      </div>

      <div class="readout">
        <div><span>観測地点</span><strong id="pointReadout">画面をタップ</strong></div>
        <div><span>電場 E</span><strong id="fieldReadout">—</strong></div>
        <div id="forceBox" hidden><span>電気力 F</span><strong id="forceReadout">—</strong></div>
      </div>

    </section>

    <section class="insight" id="insight">
      <div class="bulb">!</div>
      <div><h3>ここを確認</h3><p id="insightText">電荷を置いただけで、その周囲には電場ができます。まだ試験電荷は置いていません。</p></div>
    </section>

  </main>
  <script>
const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');
const tabs=[...document.querySelectorAll('.tab')],tools=[...document.querySelectorAll('.tool')];
let mode='field',tool='positive',charges=[],probe=null,probeVisible=true,drag=null,dpr=1,W=0,H=0;
const $=id=>document.getElementById(id);
const lessons={
 field:{k:'STEP 1 · FIELD',t:'電場は「＋1が受ける力」で見る',p:'電荷Qの周囲に、正の試験電荷＋1を置いたと考えます。Qを変えると、電場Eの向きと大きさがどう変わるか確かめましょう。',f:'E = F / q',i:'黄色い＋1は、電場を目で見るための仮想的な試験電荷です。Qの大きさを増すと電場は強くなり、Qの符号を変えると電場の向きが反対になります。',hint:'Qを変えたり、黄色い＋1を動かしたりしてみよう'},
 force:{k:'STEP 2 · FORCE',t:'電場の中に電荷を置くと、力を受ける',p:'置く電荷qの符号と大きさを変えよう。電場Eは同じでも、電気力Fの向きと大きさは変化します。',f:'F = qE',i:'正電荷には電場と同じ向き、負電荷には電場と反対向きの力が働きます。qを2倍にすれば力の矢印も2倍の長さになります。',hint:'上のスライダーで電荷qを変えてみよう'}
};
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function fieldAt(x,y){let ex=0,ey=0,v=0;for(const c of charges){let dx=x-c.x,dy=y-c.y,r2=dx*dx+dy*dy+250,r=Math.sqrt(r2);ex+=c.q*dx/(r2*r);ey+=c.q*dy/(r2*r);v+=c.q/r}return{ex,ey,e:Math.hypot(ex,ey),v}}
function arrow(x,y,dx,dy,color,width=2.4,max=34){const m=Math.hypot(dx,dy);if(m<1e-8)return;const mobile=W<600,len=Math.min(max*(mobile?1.18:1),(15+Math.log1p(m*9000)*3.1)*(mobile?1.12:1)),ux=dx/m,uy=dy/m,a=mobile?9:7;width*=mobile?1.18:1;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-ux*len*.45,y-uy*len*.45);ctx.lineTo(x+ux*len*.55,y+uy*len*.55);ctx.stroke();ctx.beginPath();ctx.moveTo(x+ux*len*.55,y+uy*len*.55);ctx.lineTo(x+ux*len*.55-ux*a-uy*a*.65,y+uy*len*.55-uy*a+ux*a*.65);ctx.lineTo(x+ux*len*.55-ux*a+uy*a*.65,y+uy*len*.55-uy*a-ux*a*.65);ctx.closePath();ctx.fill()}
function potentialMap(){const s=12;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){const v=fieldAt(x,y).v;const n=Math.tanh(v*85),a=.08+Math.abs(n)*.28;ctx.fillStyle=n>=0?`rgba(237,90,79,${a})`:`rgba(40,120,212,${a})`;ctx.fillRect(x,y,s+1,s+1)}}
function radialField(){if(!charges.length||charges[0].q===0)return;const c=charges[0],strength=Math.abs(c.q),rings=W<600?[70,125,180]:[80,145,215],count=W<600?10:12;for(const r of rings)for(let i=0;i<count;i++){const a=i*Math.PI*2/count,x=c.x+Math.cos(a)*r,y=c.y+Math.sin(a)*r;if(x<26||x>W-26||y<28||y>H-28)continue;const f=fieldAt(x,y),fade=(r===rings[0] ? 0.78 : r===rings[1] ? 0.64 : 0.50),maxLen=Math.min(68,(r===rings[0]?40:r===rings[1]?36:32)*(0.7+strength*.3));arrow(x,y,f.ex,f.ey,`rgba(23,32,42,${fade})`,r===rings[0]?3:2.5,maxLen)}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);if(mode==='potential')potentialMap();
 if(mode==='field'||mode==='force')radialField();else{const gap=W<600?64:72;for(let y=40;y<H-28;y+=gap)for(let x=38;x<W-24;x+=gap){const f=fieldAt(x,y);arrow(x,y,f.ex,f.ey,'rgba(23,32,42,.55)',2.2,28)}}
 for(const c of charges)drawCharge(c);
 if(probe&&probeVisible)drawProbe();
 updateReadout();
}
function drawCharge(c){const mobile=W<600,radius=mobile?16+Math.abs(c.q)*4.5:12+Math.abs(c.q)*4;ctx.save();ctx.shadowColor='rgba(0,0,0,.16)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;ctx.beginPath();ctx.arc(c.x,c.y,radius,0,Math.PI*2);ctx.fillStyle=c.q>0?'#ed5a4f':c.q<0?'#2878d4':'#7d858c';ctx.fill();ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();if(c.q===0){ctx.font='800 16px Meiryo, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('0',c.x,c.y)}else{ctx.moveTo(c.x-8,c.y);ctx.lineTo(c.x+8,c.y);if(c.q>0){ctx.moveTo(c.x,c.y-8);ctx.lineTo(c.x,c.y+8)}ctx.stroke()}}
function forceArrow(x,y,dx,dy,radius,color,label,scale=1){const m=Math.hypot(dx,dy);if(m<1e-8||scale<=0)return;const mobile=W<600,ux=dx/m,uy=dy/m,start=radius+(mobile?8:5),base=(mobile?34:28)+Math.min(mobile?13:10,Math.log1p(m*12000)*(mobile?2.8:2.3)),len=Math.min(mobile?190:175,base*scale),end=start+len,a=mobile?14:11;ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=mobile?6.5:5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+ux*start,y+uy*start);ctx.lineTo(x+ux*end,y+uy*end);ctx.stroke();ctx.beginPath();ctx.moveTo(x+ux*end,y+uy*end);ctx.lineTo(x+ux*end-ux*a-uy*a*.7,y+uy*end-uy*a+ux*a*.7);ctx.lineTo(x+ux*end-ux*a+uy*a*.7,y+uy*end-uy*a-ux*a*.7);ctx.closePath();ctx.fill();ctx.font=`800 ${mobile?18:15}px Meiryo, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+ux*(end+16),y+uy*(end+16));ctx.restore()}
function drawProbe(){const f=fieldAt(probe.x,probe.y),q=+($('testCharge').value),isForce=mode==='force';const mobile=W<600,radius=isForce?(mobile?16+Math.abs(q)*4.5:12+Math.abs(q)*4):(mobile?20:15);ctx.save();ctx.globalAlpha=mode==='field'?.72:1;ctx.shadowColor='rgba(0,0,0,.16)';ctx.shadowBlur=7;ctx.shadowOffsetY=2;ctx.beginPath();ctx.arc(probe.x,probe.y,radius,0,Math.PI*2);ctx.fillStyle=isForce?(q>0?'#ed5a4f':q<0?'#2878d4':'#7d858c'):'#f3b63f';ctx.fill();ctx.restore();ctx.strokeStyle=isForce?'#fff':'#624d12';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=isForce?'#fff':'#4d3a08';ctx.font=`800 ${isForce?Math.max(mobile?17:14,radius):mobile?15:12}px Meiryo, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(isForce?(q>0?'+':q<0?'−':'0'):'+1',probe.x,probe.y-1);if(isForce){if(q!==0)forceArrow(probe.x,probe.y,f.ex*Math.sign(q),f.ey*Math.sign(q),radius,q>0?'#c92f2a':'#185da8','F',Math.abs(q))}else{const sourceStrength=Math.abs(charges[0]?.q||0);if(sourceStrength>0)forceArrow(probe.x,probe.y,f.ex/sourceStrength,f.ey/sourceStrength,radius,'#13866f','E',sourceStrength)}}
function updateReadout(){if(!probe||!probeVisible){$('pointReadout').textContent='試験電荷なし';$('fieldReadout').textContent=charges.length?'空間に存在':'—';return}const f=fieldAt(probe.x,probe.y),q=+($('testCharge').value);$('pointReadout').textContent=`(${Math.round(probe.x)}, ${Math.round(probe.y)})`;$('fieldReadout').textContent=`${(f.e*10000).toFixed(2)}（相対値）`;$('forceReadout').textContent=`${(f.e*Math.abs(q)*10000).toFixed(2)} ／ ${q<0?'電場と反対':q>0?'電場と同じ':'力なし'}${q===0?'':'向き'}`}
function setMode(m){mode=m;tabs.forEach(b=>b.classList.toggle('active',b.dataset.mode===m));const l=lessons[m];$('lessonKicker').textContent=l.k;$('lessonTitle').textContent=l.t;$('lessonText').textContent=l.p;$('formula').textContent=l.f;$('insightText').textContent=l.i;$('canvasHint').textContent=l.hint;if(!probe)probe={x:W*.72,y:H*.55};if(m==='force')probeVisible=true;$('probeLegend').hidden=false;$('probeToggle').hidden=m!=='field';$('probeToggle').textContent=probeVisible?'試験電荷を隠す':'試験電荷を表示';$('sourceTools').hidden=true;$('fieldTopControl').hidden=m!=='field';$('forceTopControl').hidden=m!=='force';$('forceBox').hidden=m!=='force';draw()}
function pointerPos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
function nearest(p){let best=null,d=28;for(const c of charges){const nd=Math.hypot(c.x-p.x,c.y-p.y);if(nd<d){best=c;d=nd}}if(probe&&probeVisible&&Math.hypot(probe.x-p.x,probe.y-p.y)<32)return{probe:true};return best}
function down(e){e.preventDefault();const p=pointerPos(e),n=nearest(p);if(mode==='force'){if(n?.probe)drag={probe:true};else if(!n&&probeVisible)probe={x:p.x,y:p.y};draw();return}if(n){if(tool==='delete'&&!n.probe){charges=charges.filter(c=>c!==n);draw();return}drag=n.probe?{probe:true}:n;return}if(tool==='positive'||tool==='negative'){const c={x:p.x,y:p.y,q:tool==='positive'?1:-1};if(mode==='field')charges=[c];else charges.push(c);$('canvasHint').style.opacity=.2}else if(probeVisible){probe={x:p.x,y:p.y}}draw()}
function move(e){if(!drag)return;e.preventDefault();const p=pointerPos(e);if(drag.probe)probe=p;else{drag.x=p.x;drag.y=p.y}draw()}
function up(){drag=null}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
tabs.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));tools.forEach(b=>b.onclick=()=>{tool=b.dataset.tool;tools.forEach(x=>x.classList.toggle('active',x===b));$('canvasHint').textContent=tool==='delete'?'消したい電荷をタップ':tool==='move'?'電荷や試験電荷をドラッグ':'空いている場所をタップして電荷を置こう'});
$('resetBtn').onclick=()=>{charges=[{x:W*.34,y:H*.5,q:1}];probe={x:W*.72,y:H*.5};probeVisible=true;$('sourceCharge').value=1;$('sourceChargeOut').textContent='＋1';$('testCharge').value=1;$('testChargeOut').textContent='＋1';$('probeToggle').textContent='試験電荷を隠す';$('canvasHint').textContent=lessons[mode].hint;draw()};$('testCharge').oninput=e=>{$('testChargeOut').textContent=(+e.target.value>0?'＋':'')+e.target.value;draw()};
$('sourceCharge').oninput=e=>{const q=+e.target.value;if(!charges.length)charges=[{x:W*.34,y:H*.5,q}];else charges[0].q=q;$('sourceChargeOut').textContent=(q>0?'＋':'')+q;draw()};
$('probeToggle').onclick=()=>{probeVisible=!probeVisible;if(probeVisible&&!probe)probe={x:W*.72,y:H*.5};$('probeToggle').textContent=probeVisible?'試験電荷を隠す':'試験電荷を表示';$('canvasHint').textContent=probeVisible?lessons[mode].hint:'試験電荷がなくても、電場は空間に残っている';draw()};
addEventListener('resize',resize);resize();charges=[{x:W*.34,y:H*.5,q:1}];probe={x:W*.72,y:H*.5};setMode('field');

  </script>
</body>
</html>
