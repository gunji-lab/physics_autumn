<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Trainer 2｜電磁気</title>
<link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header><p class="eyebrow">PHYSICS TRAINER 2 · 秋学期</p><h1>電磁気トレーナー</h1><p>まずはクーロンの法則を練習しましょう。</p></header>
<section id="identity" class="notice" aria-live="polite">大学アカウントでログインしてください。</section>
<p><button id="login" type="button">大学アカウントでログイン</button></p>
<section id="home" class="card"><h2>10/2　電荷とクーロンの法則</h2><p>3問のテスト版です。70%以上でクリアになります。</p><p id="progress">進捗を読み込み中…</p><button id="start">練習を始める</button></section>
<section id="quiz" class="card" hidden><p id="count" class="eyebrow"></p><h2 id="prompt"></h2><div id="choices" class="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>次へ</button></section>
<section id="result" class="card" hidden><h2>結果</h2><p id="score"></p><p id="sendStatus" aria-live="polite"></p><button id="retry">もう一度</button></section>
<footer>大学アカウントでログインし、回答履歴は秋学期専用のスプレッドシートに保存します。</footer></main>
<script src="questions.js"></script><script src="trainer.js"></script></body></html>
